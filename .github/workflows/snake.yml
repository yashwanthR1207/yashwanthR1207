name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *" 
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yashwanthR1207
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Modify SVG to replace snake with car
        run: |
          python -c '
          import re, os
          def replace_snake_with_car(filename):
              if not os.path.exists(filename): return
              with open(filename, "r") as f: content = f.read()
              content = re.sub(r"<rect class=\"s s0\"[^>]*>", "<text class=\"s s0\" x=\"-4\" y=\"13\" font-size=\"14\">🚗</text>", content)
              content = re.sub(r"<rect class=\"s s[1-9][0-9]*\"[^>]*>", "", content)
              with open(filename, "w") as f: f.write(content)
          replace_snake_with_car("dist/github-contribution-grid-snake.svg")
          replace_snake_with_car("dist/github-contribution-grid-snake-dark.svg")
          '
          
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
