<svg width="240" height="260" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad_postman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0099ff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="border_postman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0099ff" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="glowGrad_postman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0099ff" stop-opacity="0.2" />
    </linearGradient>
    
    <filter id="neon_text_postman" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon_logo_postman" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Master Floating Animation -->
    <animateTransform attributeName="transform" type="translate" values="0,2; 0,-8; 0,2" dur="4s" repeatCount="indefinite" />
    
    <!-- Outer Glow Behind Card -->
    <rect x="25" y="25" width="190" height="210" rx="20" fill="url(#glowGrad_postman)" filter="blur(20px)">
      <animate attributeName="opacity" values="0.4; 0.8; 0.4" dur="3s" repeatCount="indefinite" />
    </rect>

    <!-- Glassmorphism Card Base -->
    <rect x="25" y="25" width="190" height="210" rx="20" fill="#0D1117" stroke="url(#border_postman)" stroke-width="2" />
    <rect x="25" y="25" width="190" height="210" rx="20" fill="url(#grad_postman)" />

    <!-- Animated Particle Rings -->
    <circle cx="120" cy="110" r="50" fill="none" stroke="#00ff88" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" values="0 120 110; 360 120 110" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="120" cy="110" r="65" fill="none" stroke="#0099ff" stroke-width="1" stroke-dasharray="2 10" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" values="360 120 110; 0 120 110" dur="15s" repeatCount="indefinite" />
    </circle>
    
    <!-- Logo with Neon Glow and Pulse -->
    <g transform="translate(80, 70) scale(3.3)" fill="#ffffff" filter="url(#neon_logo_postman)">
      <animate attributeName="opacity" values="0.7; 1; 0.7" dur="2.5s" repeatCount="indefinite" />
      <path d="M13.527.099C6.955-.744.942 3.9.099 10.473c-.843 6.572 3.8 12.584 10.373 13.428 6.573.843 12.587-3.801 13.428-10.374C24.744 6.955 20.101.943 13.527.099zm2.471 7.485a.855.855 0 0 0-.593.25l-4.453 4.453-.307-.307-.643-.643c4.389-4.376 5.18-4.418 5.996-3.753zm-4.863 4.861l4.44-4.44a.62.62 0 1 1 .847.903l-4.699 4.125-.588-.588zm.33.694l-1.1.238a.06.06 0 0 1-.067-.032.06.06 0 0 1 .01-.073l.645-.645.512.512zm-2.803-.459l1.172-1.172.879.878-1.979.426a.074.074 0 0 1-.085-.039.072.072 0 0 1 .013-.093zm-3.646 6.058a.076.076 0 0 1-.069-.083.077.077 0 0 1 .022-.046h.002l.946-.946 1.222 1.222-2.123-.147zm2.425-1.256a.228.228 0 0 0-.117.256l.203.865a.125.125 0 0 1-.211.117h-.003l-.934-.934-.294-.295 3.762-3.758 1.82-.393.874.874c-1.255 1.102-2.971 2.201-5.1 3.268zm5.279-3.428h-.002l-.839-.839 4.699-4.125a.952.952 0 0 0 .119-.127c-.148 1.345-2.029 3.245-3.977 5.091zm3.657-6.46l-.003-.002a1.822 1.822 0 0 1 2.459-2.684l-1.61 1.613a.119.119 0 0 0 0 .169l1.247 1.247a1.817 1.817 0 0 1-2.093-.343zm2.578 0a1.714 1.714 0 0 1-.271.218h-.001l-1.207-1.207 1.533-1.533c.661.72.637 1.832-.054 2.522zM18.855 6.05a.143.143 0 0 0-.053.157.416.416 0 0 1-.053.45.14.14 0 0 0 .023.197.141.141 0 0 0 .084.03.14.14 0 0 0 .106-.05.691.691 0 0 0 .087-.751.138.138 0 0 0-.194-.033z"/>
    </g>
    
    <!-- Technology Name -->
    <text x="120" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" filter="url(#neon_text_postman)">Postman</text>
  </g>
</svg>