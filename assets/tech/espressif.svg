<svg width="240" height="260" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad_espressif" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b500ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#5000ff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="border_espressif" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b500ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#5000ff" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="glowGrad_espressif" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b500ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#5000ff" stop-opacity="0.2" />
    </linearGradient>
    
    <filter id="neon_text_espressif" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon_logo_espressif" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Master Floating Animation -->
    <animateTransform attributeName="transform" type="translate" values="0,2; 0,-8; 0,2" dur="4s" repeatCount="indefinite" />
    
    <!-- Outer Glow Behind Card -->
    <rect x="25" y="25" width="190" height="210" rx="20" fill="url(#glowGrad_espressif)" filter="blur(20px)">
      <animate attributeName="opacity" values="0.4; 0.8; 0.4" dur="3s" repeatCount="indefinite" />
    </rect>

    <!-- Glassmorphism Card Base -->
    <rect x="25" y="25" width="190" height="210" rx="20" fill="#0D1117" stroke="url(#border_espressif)" stroke-width="2" />
    <rect x="25" y="25" width="190" height="210" rx="20" fill="url(#grad_espressif)" />

    <!-- Animated Particle Rings -->
    <circle cx="120" cy="110" r="50" fill="none" stroke="#b500ff" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" values="0 120 110; 360 120 110" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="120" cy="110" r="65" fill="none" stroke="#5000ff" stroke-width="1" stroke-dasharray="2 10" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" values="360 120 110; 0 120 110" dur="15s" repeatCount="indefinite" />
    </circle>
    
    <!-- Logo with Neon Glow and Pulse -->
    <g transform="translate(80, 70) scale(3.3)" fill="#ffffff" filter="url(#neon_logo_espressif)">
      <animate attributeName="opacity" values="0.7; 1; 0.7" dur="2.5s" repeatCount="indefinite" />
      <path d="M12.926 19.324a7.6 7.6 0 00-2.983-6.754 7.44 7.44 0 00-3.828-1.554.697.697 0 01-.606-.731.674.674 0 01.743-.617 8.97 8.97 0 018 9.805 7.828 7.828 0 01-.298 1.542l1.989.56a11.039 11.039 0 001.714-.651 12.159 12.159 0 00.217-2.343A12.57 12.57 0 007.212 6.171a5.53 5.53 0 00-2 0 4.354 4.354 0 00-2.16 1.337 4.274 4.274 0 001.909 6.856 9.896 9.896 0 001.074.195 4.011 4.011 0 013.337 3.954 3.965 3.965 0 01-.64 2.16l1.371.88a10.182 10.182 0 002.057.342 7.52 7.52 0 00.754-2.628m.16 4.73A13.073 13.073 0 01.001 10.983 12.982 12.982 0 013.83 1.737l.743.697a12.067 12.067 0 000 17.141 12.067 12.067 0 0017.141 0l.697.697a12.97 12.97 0 01-9.336 3.726M24 10.993A10.993 10.993 0 0012.949 0c-.389 0-.766 0-1.143.057l-.252.732a18.912 18.912 0 0111.588 11.576l.731-.263c0-.366.069-.732.069-1.143m-1.269 5.165A17.53 17.53 0 007.818 1.27a11.119 11.119 0 00-2.457 1.77v1.635A13.919 13.919 0 0119.268 18.57h1.634a11.713 11.713 0 001.771-2.446M7.92 17.884a1.691 1.691 0 11-1.69-1.691 1.691 1.691 0 011.69 1.691"/>
    </g>
    
    <!-- Technology Name -->
    <text x="120" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" filter="url(#neon_text_espressif)">ESP32</text>
  </g>
</svg>