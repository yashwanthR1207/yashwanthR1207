<svg width="240" height="260" viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad_cplusplus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="border_cplusplus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="glowGrad_cplusplus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0.2" />
    </linearGradient>
    
    <filter id="neon_text_cplusplus" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon_logo_cplusplus" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g>
    <!-- Master Floating Animation -->
    <animateTransform attributeName="transform" type="translate" values="0,2; 0,-8; 0,2" dur="4s" repeatCount="indefinite" />
    
    <!-- Outer Glow Behind Card -->
    <rect x="25" y="25" width="190" height="210" rx="20" fill="url(#glowGrad_cplusplus)" filter="blur(20px)">
      <animate attributeName="opacity" values="0.4; 0.8; 0.4" dur="3s" repeatCount="indefinite" />
    </rect>

    <!-- Glassmorphism Card Base -->
    <rect x="25" y="25" width="190" height="210" rx="20" fill="#0D1117" stroke="url(#border_cplusplus)" stroke-width="2" />
    <rect x="25" y="25" width="190" height="210" rx="20" fill="url(#grad_cplusplus)" />

    <!-- Animated Particle Rings -->
    <circle cx="120" cy="110" r="50" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" values="0 120 110; 360 120 110" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="120" cy="110" r="65" fill="none" stroke="#0077ff" stroke-width="1" stroke-dasharray="2 10" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" values="360 120 110; 0 120 110" dur="15s" repeatCount="indefinite" />
    </circle>
    
    <!-- Logo with Neon Glow and Pulse -->
    <g transform="translate(80, 70) scale(3.3)" fill="#ffffff" filter="url(#neon_logo_cplusplus)">
      <animate attributeName="opacity" values="0.7; 1; 0.7" dur="2.5s" repeatCount="indefinite" />
      <path d="M22.394 6c-.167-.29-.398-.543-.652-.69L12.926.22c-.509-.294-1.34-.294-1.848 0L2.26 5.31c-.508.293-.923 1.013-.923 1.6v10.18c0 .294.104.62.271.91.167.29.398.543.652.69l8.816 5.09c.508.293 1.34.293 1.848 0l8.816-5.09c.254-.147.485-.4.652-.69.167-.29.27-.616.27-.91V6.91c.003-.294-.1-.62-.268-.91zM12 19.11c-3.92 0-7.109-3.19-7.109-7.11 0-3.92 3.19-7.11 7.11-7.11a7.133 7.133 0 016.156 3.553l-3.076 1.78a3.567 3.567 0 00-3.08-1.78A3.56 3.56 0 008.444 12 3.56 3.56 0 0012 15.555a3.57 3.57 0 003.08-1.778l3.078 1.78A7.135 7.135 0 0112 19.11zm7.11-6.715h-.79v.79h-.79v-.79h-.79v-.79h.79v-.79h.79v.79h.79zm2.962 0h-.79v.79h-.79v-.79h-.79v-.79h.79v-.79h.79v.79h.79z"/>
    </g>
    
    <!-- Technology Name -->
    <text x="120" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" filter="url(#neon_text_cplusplus)">C++</text>
  </g>
</svg>